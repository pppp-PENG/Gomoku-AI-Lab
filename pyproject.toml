[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gomoku-ai-lab"
version = "0.1.0"
description = "Local reproducible CNN and ViT self-play research platform"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "numpy>=2,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psutil>=6,<8", "tensorboard>=2.19,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
gomoku = "gomoku.cli:main"

[tool.setuptools.packages.find]
include = ["gomoku*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
